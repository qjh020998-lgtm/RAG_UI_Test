    - input_id
    - number
    returns: bool
    kind: step
    scope: list
    module: common
  transfer_to_inbound:
    step: 转采购入库：{number}
    args:
    - number
    returns: Locator
    kind: step
    scope: list
    module: common
    side_effect:
    - opens_modal
  choose_payment_bill:
    step: 付款单选择采购欠款单据：{number}
    args:
    - number
    returns: None
    kind: step
    scope: create_modal
    module: common
  fill_payment_amount:
    step: 付款单填写本次付款：{value}
    args:
    - value
    returns: None
    kind: step
    scope: create_modal
    module: common
  create_requisition:
    step: 创建请购单：{product} x {quantity}
    args:
    - product
    - quantity
    - audit
    returns: str
    kind: step
    scope: list
    module: common
    side_effect:
    - navigates
    - creates_bill
  create_order:
    step: 创建采购订单：{product} x {quantity}
    args:
    - supplier
    - product
    - quantity
    - price
    - account
    returns: str
    kind: step
    scope: list
    module: common
    side_effect:
    - navigates
    - creates_bill
  create_inbound:
    step: 创建采购入库单：{product} x {quantity}
    args:
    - supplier
    - product
    - quantity
    - price
    - account
    - audit
    returns: str
    kind: step
    scope: list
    module: common
    side_effect:
    - navigates
    - creates_bill
  create_return:
    step: 创建采购退货单：{product} x {quantity}
    args:
    - supplier
    - product
    - quantity
    - price
    - account
    - audit
    returns: str
    kind: step
    scope: list
    module: common
    side_effect:
    - navigates
    - creates_bill
  transfer_to_return:
    step: 转采购退货：{number}
    args:
    - number
    returns: None
    kind: step
    scope: list
    module: common
    side_effect:
    - opens_modal
  wait_for_status:
    step: 等待单据状态：{number} -> {expected}
    args:
    - number
    - expected
    - timeout
    returns: None
    kind: step
    scope: list
    module: common
  delete_bill:
    step: 删除单据：{number}
    args:
    - number
    - module
    returns: None
    kind: step
    scope: list
    module: common
    side_effect:
    - navigates
    - deletes_bill
