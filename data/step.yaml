    args:
    - timeout
    returns: str
    kind: step
    scope: list
    module: common
  get_last_product_stock:
    step: 读取商品库存
    args: []
    returns: str
    kind: step
    scope: list
    module: common
    stale: true
    requires:
    - open_add_modal
    - open_product_selector
  fill_change_amount:
    step: 填写本次退款/付款金额
    args:
    - value
    returns: None
    kind: step
    scope: create_modal
    module: common
  get_debt_value:
    step: 读取欠款金额
    args: []
    returns: str
    kind: step
    scope: list
    module: common
  select_supplier:
    step: 选择供应商
    args:
    - name
    returns: None
    kind: step
    scope: create_modal
    module: common
  select_account:
    step: 选择结算账户
    args:
    - name
    returns: None
    kind: step
    scope: create_modal
    module: common
  select_warehouse:
