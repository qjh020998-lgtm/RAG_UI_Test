[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 启用逐条 assert 成功日志；修改后需清除 testcases/__pycache__ 再运行
enable_assertion_pass_hook = true
markers =
    smoke: Quick smoke tests for critical paths
    regression: Full regression test suite
    e2e: End-to-end flow tests
    web: Web UI tests
    no_auth: Tests that must start from a logged-out browser context
addopts =
    -v
    -rs
    --tb=short
    --strict-markers
