[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Quick smoke tests for critical paths
    regression: Full regression test suite
    e2e: End-to-end flow tests
    web: Web UI tests
    no_auth: Tests that must start from a logged-out browser context
addopts =
    -v
    --tb=short
    --strict-markers
