[project]
name = "rag-ui-test"
version = "0.1.0"
description = "RAG + Playwright + LLM UI自动化测试框架"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-text-splitters>=0.3.8",
    "langgraph>=1.2.16",
    "playwright>=1.64.0",
    "pydantic-settings>=2.16.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.0",
    "PyMuPDF>=1.24.0",
    "rapidocr-onnxruntime==1.4.4",
    "flagembedding>=1.4.2",
    # Phase 2.5：暂 pin 在 3.0.x，Phase 3 前再迁移到 MilvusClient（技术债）
    "pymilvus>=3.0.2,<3.1",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    # API driver for optional test-data setup
    "httpx>=0.28.0",
    "allure-pytest>=2.16.2",
    "pytest-playwright>=0.10.0",
    "chroma>=0.2.0",
    "langchain-openai>=1.7.2",
]

[[index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
