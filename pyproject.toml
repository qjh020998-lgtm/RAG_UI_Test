[project]
name = "rag-ui-test"
version = "0.1.0"
description = "RAG + Playwright + LLM UI自动化测试框架"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-text-splitters>=0.3.8",
    "langgraph>=1.2.16",
    "playwright>=1.64.0",
    "pydantic-settings>=2.16.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.1",
    "PyMuPDF>=1.24.0",
    "rapidocr-onnxruntime==1.4.4",
]

[[index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
